<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1013 1552" font-family="Arial, Helvetica, sans-serif" class="mapa-lotes" role="img" aria-label="Mapa de disponibilidade das 14 chácaras">
<style>
  .mapa-lotes .lote{stroke:#1b1b1b;stroke-width:4;stroke-linejoin:round;transition:fill .15s;}
  .mapa-lotes .disponivel .lote{fill:#b7e7b0;}
  .mapa-lotes .vendida   .lote{fill:#ef8a7f;}
  .mapa-lotes .disponivel{cursor:pointer;}
  .mapa-lotes .disponivel:hover .lote{fill:#8fd68a;}
  .mapa-lotes .rot{text-anchor:middle;pointer-events:none;fill:#141414;}
  .mapa-lotes .num{font-weight:800;font-size:40px;}
  .mapa-lotes .st{font-size:18px;font-weight:600;letter-spacing:.5px;}
</style>
