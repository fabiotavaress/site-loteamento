<script><![CDATA[
(function(){
  // ===== EDITE AQUI: numeros das chacaras VENDIDAS =====
  var VENDIDAS = ["09","10","11","12","13"];
  // =====================================================
  var WA = "5531990762890";
  document.querySelectorAll(".mapa-lotes .lote-g").forEach(function(g){
    var n = g.getAttribute("data-lote");
    var vendida = VENDIDAS.indexOf(n) !== -1;
    g.classList.add(vendida ? "vendida" : "disponivel");
    g.querySelector(".st").textContent = vendida ? "VENDIDA" : "DISPONÍVEL";
    if(!vendida){
      g.style.cursor = "pointer";
      g.setAttribute("role","link");
      g.setAttribute("aria-label","Chácara "+n+" — falar no WhatsApp");
      g.addEventListener("click", function(){
        var msg = encodeURIComponent("Olá! Vi o site do Recanto da Lagoa e tenho interesse na chácara "+n+".");
        window.open("https://wa.me/"+WA+"?text="+msg, "_blank", "noopener");
      });
    }
  });
})();
]]></script>
</svg>